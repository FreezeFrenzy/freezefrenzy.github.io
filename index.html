<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #fff;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    .search-box {
      margin-bottom: 20px;
    }
    .search-box input {
      width: 94%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }
    .download-box {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      transition: transform 0.2s;
    }
    .download-box:hover {
      transform: scale(1.02);
    }
    a.button {
      display: inline-block;
      padding: 10px 16px;
      background: #2196F3;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .hidden {
      display: none;
    }
    #pagination {
      text-align: center;
      margin-top: 20px;
    }
    #pagination button {
      margin: 5px;
      padding: 5px 10px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      background: #555;
      color: #fff;
    }
    #pagination button:hover {
      background: #0b7dda;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>List Of Games</h1>

    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search files...">
    </div>

    <!-- Download Boxes -->
    <div class="download-box">
      <h2>Black Souls</h2>
      <img src="YOUR_IMAGE_LINK_1" alt="File 1 Image">
      <p>Description goes here.</p>
      <a href="YOUR_DOWNLOAD_LINK_1" class="button" target="_blank">Download</a>
    </div>

    <div class="download-box">
      <h2>My File 2</h2>
      <img src="YOUR_IMAGE_LINK_2" alt="File 2 Image">
      <p>Another file description.</p>
      <a href="YOUR_DOWNLOAD_LINK_2" class="button" target="_blank">Download</a>
    </div>

    <div class="download-box">
      <h2>Sample PDF</h2>
      <img src="YOUR_IMAGE_LINK_3" alt="Sample PDF">
      <p>PDF file example.</p>
      <a href="YOUR_DOWNLOAD_LINK_3" class="button" target="_blank">Download</a>
    </div>

    <div class="download-box">
      <h2>File 4</h2>
      <img src="YOUR_IMAGE_LINK_4" alt="File 4 Image">
      <p>Description for file 4.</p>
      <a href="YOUR_DOWNLOAD_LINK_4" class="button" target="_blank">Download</a>
    </div>

    <div class="download-box">
      <h2>File 5</h2>
      <img src="YOUR_IMAGE_LINK_5" alt="File 5 Image">
      <p>Description for file 5.</p>
      <a href="YOUR_DOWNLOAD_LINK_5" class="button" target="_blank">Download</a>
    </div>

    <!-- Pagination -->
    <div id="pagination"></div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const downloadBoxes = Array.from(document.querySelectorAll('.download-box'));
    const itemsPerPage = 5; // Changed to 5 download boxes per page
    let currentPage = 1;

    // Function to show items for the current page
    function showPage(page) {
      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;

      downloadBoxes.forEach((box, index) => {
        if (index >= start && index < end) {
          box.style.display = "block";
        } else {
          box.style.display = "none";
        }
      });

      currentPage = page;
      renderPagination();
    }

    // Function to render page numbers
    function renderPagination() {
      const totalPages = Math.ceil(downloadBoxes.length / itemsPerPage);
      const paginationContainer = document.getElementById('pagination');
      paginationContainer.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const pageBtn = document.createElement('button');
        pageBtn.textContent = i;
        pageBtn.style.background = (i === currentPage) ? "#2196F3" : "#555";

        pageBtn.addEventListener('click', () => showPage(i));
        paginationContainer.appendChild(pageBtn);
      }
    }

    // Search functionality
    searchInput.addEventListener('keyup', () => {
      const query = searchInput.value.toLowerCase();
      downloadBoxes.forEach(box => {
        const title = box.querySelector('h2').textContent.toLowerCase();
        const desc = box.querySelector('p').textContent.toLowerCase();
        box.style.display = (title.includes(query) || desc.includes(query)) ? "block" : "none";
      });
    });

    // Initial call to show first page
    showPage(1);
  </script>
</body>
</html>
